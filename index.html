
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>My Image Gallery</h1>
        <p>A little collection of beautiful moments ✨</p>
    </header>

    <main>
        <div class="gallery">
            <div class="gallery-item">
                <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=600" alt="Beautiful mountain lake">
            </div>

            <div class="gallery-item">
                <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=600" alt="Scenic nature landscape">
            </div>

            <div class="gallery-item">
                <img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=600" alt="Sunrise over green hills">
            </div>

            <div class="gallery-item">
                <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=600" alt="Lake surrounded by mountains">
            </div>

            <div class="gallery-item">
                <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=600" alt="Sunlight in a forest">
            </div>

            <div class="gallery-item">
                <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=600" alt="Snowy mountain peaks">
            </div>
        </div>
    </main>
        </div>
        
<div class="lightbox" id="lightbox">
    <button class="close-btn" id="closeBtn" aria-label="Close">&times;</button>

    <button class="nav-btn prev-btn" id="prevBtn" aria-label="Previous image">&#10094;</button>

    <img src="" alt="Expanded gallery image" id="lightboxImg">

    <button class="nav-btn next-btn" id="nextBtn" aria-label="Next image">&#10095;</button>

    <p id="imageCounter"></p>
</div>

    </main>



    <script src="script.js"></script>
</body>
</html>
